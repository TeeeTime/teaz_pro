# Teaz login theme: Keycloak's own keycloak.v2 (PatternFly 5) login pages,
# restyled with the house tokens. See keycloak-themes/README.md.
parent=keycloak.v2
import=common/keycloak

# styles.css is the parent's (resolved from keycloak.v2), kept for its
# layout/tooltip/divider rules; teaz.css overrides it.
styles=css/styles.css css/tokens.css css/teaz.css

# Dark mode is driven by js/theme.js (light / dark / dark-blue), not by
# keycloak.v2's prefers-color-scheme-only switch.
darkMode=false
scripts=js/theme.js
